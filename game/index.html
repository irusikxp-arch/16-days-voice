    // === ДАНІ РІВНІВ ===

    // === УТИЛІТИ ===
    function createDialogBox(scene, name, text, onClose) {
        if (scene.dialogBox) scene.dialogBox.destroy();
        if (scene.dialogName) scene.dialogName.destroy();
        if (scene.dialogText) scene.dialogText.destroy();

        scene.dialogBox = scene.add.rectangle(512, 620, 900, 180, 0x0a0e1a, 0.95);
        scene.dialogBox.setStrokeStyle(2, 0xff6b35);
        scene.dialogBox.setDepth(1000);

        scene.dialogName = scene.add.text(70, 550, name, {
            fontSize: '22px', color: '#ff6b35', fontStyle: 'bold', fontFamily: 'Arial'
        }).setDepth(1001);

        scene.dialogText = scene.add.text(70, 580, text, {
            fontSize: '18px', color: '#ffffff', fontFamily: 'Arial',
            wordWrap: { width: 850 }
        }).setDepth(1001);

        scene.dialogBox.setInteractive({ useHandCursor: true });
        scene.dialogBox.once('pointerdown', () => {
            scene.dialogBox.destroy();
            scene.dialogName.destroy();
            scene.dialogText.destroy();
            if (onClose) onClose();
        });
    }

    // Діалогова логіка, спільна для спрайтів і фолбеків
    function attachDialogLogic(scene, target, color, name, dialogKey, levelKey, onFact) {
        target.on('pointerdown', () => {
            const dialogs = ALL_DIALOGS[levelKey][dialogKey];
            if (!dialogs || dialogs.length === 0) {
                createDialogBox(scene, name, 'Персонаж вже все розповів.');
                return;
            }
            const current = dialogs[0];
            createDialogBox(scene, current.name, current.text, () => {
                if (current.empathy) {
                    gameState.empathy = Math.max(0, Math.min(100, gameState.empathy + current.empathy));
                    if (scene.empathyText) scene.empathyText.setText(`💚 Емпатія: ${gameState.empathy}%`);
                }
                if (current.fact && !current.collected) {
                    gameState.factsCollected++;
                    current.collected = true;
                    if (scene.factsText) scene.factsText.setText(`📋 Факти: ${gameState.factsCollected}/${LEVELS[gameState.currentLevel].facts}`);
                    if (onFact) onFact();
                    saveProgress();

                    if (gameState.factsCollected >= LEVELS[gameState.currentLevel].facts) {
                        scene.time.delayedCall(1500, () => scene.completeLevel());
                    }
                }
            });
        });
    }

    // Персонаж-спрайт із тінню, табличкою імені та ховер-ефектом
    function createCharacterSprite(scene, x, feetY, def, name, dialogKey, levelKey) {
        const spriteKey = 'char_' + (typeof def === 'string' ? def : def.s);

        const shadow = scene.add.ellipse(x, feetY - 6, 130, 26, 0x000000, 0.30).setDepth(feetY - 2);

        const spr = scene.add.image(x, feetY, spriteKey).setOrigin(0.5, 1).setDepth(feetY - 1);
        spr.setScale(CHAR_SCALE);
        if (typeof def === 'object') {
            if (def.tint) spr.setTint(def.tint);
            if (def.flip) spr.setFlipX(true);
        }

        // Табличка імені
        const label = scene.add.text(x, Math.min(feetY + 10, 736), name, {
            fontSize: '15px', color: '#ffffff', fontFamily: 'Arial',
            backgroundColor: 'rgba(10,14,26,0.72)', padding: { x: 8, y: 4 }
        }).setOrigin(0.5, 0).setDepth(902); // над нижньою UI-смугою

        let badge = null;
        spr.setInteractive({ useHandCursor: true });
        label.setInteractive({ useHandCursor: true });

        const hoverIn = () => {
            scene.tweens.add({ targets: spr, scaleX: spr.scaleX * 1.045, scaleY: spr.scaleY * 1.045, duration: 120 });
            spr.setDepth(900); label.setDepth(902); shadow.setDepth(899);
        };
        const hoverOut = () => {
            spr.setScale(CHAR_SCALE);
            spr.setDepth(feetY - 1); label.setDepth(902); shadow.setDepth(feetY - 2);
        };
        spr.on('pointerover', hoverIn); spr.on('pointerout', hoverOut);
        label.on('pointerover', hoverIn); label.on('pointerout', hoverOut);

        attachDialogLogic(scene, spr, null, name, dialogKey, levelKey, () => {
            if (badge) return;
            badge = scene.add.text(x, feetY - CHAR_HEIGHT - 14, '✅', { fontSize: '26px' })
                .setOrigin(0.5).setDepth(903);
            scene.tweens.add({ targets: badge, y: feetY - CHAR_HEIGHT - 34, alpha: 0.9, duration: 400 });
        });
        // Клік по табличці = клік по персонажу
        label.on('pointerdown', () => spr.emit('pointerdown'));

        return spr;
    }

    // Фолбек, якщо спрайт для ролі не описано (старі кольорові фігурки)
    function createCharacterPlaceholder(scene, x, y, color, name, dialogKey, levelKey) {
        const body = scene.add.rectangle(x, y, 50, 90, color);
        const head = scene.add.circle(x, y - 60, 25, color);
        const label = scene.add.text(x - 25, y + 45, name, {
            fontSize: '14px', color: '#ffffff', fontFamily: 'Arial'
        });
        const group = scene.add.container(x, y);
        group.add([body, head, label]);
        group.setSize(70, 110);
        group.setInteractive({ useHandCursor: true });
        group.on('pointerover', () => body.setFillStyle(Phaser.Display.Color.GetColor(
            Phaser.Display.Color.GetR(color) + 40,
            Phaser.Display.Color.GetG(color) + 40,
            Phaser.Display.Color.GetB(color) + 40
        )));
        group.on('pointerout', () => body.setFillStyle(color));
        attachDialogLogic(scene, group, color, name, dialogKey, levelKey, () => body.setStrokeStyle(3, 0x4ade80));
        return group;
    }

    function createCharacter(scene, x, y, color, name, dialogKey, levelKey, groundY) {
        const levelNum = parseInt(levelKey.replace('level', ''), 10);
        const def = (CHAR_SPRITES[levelNum] || {})[dialogKey];
        const feetY = groundY || (y + 190); // y у конфігах рівнів = "центр", переводимо в лінію підлоги
        if (def && scene.textures.exists('char_' + (typeof def === 'string' ? def : def.s))) {
            return createCharacterSprite(scene, x, feetY, def, name, dialogKey, levelKey);
        }
        return createCharacterPlaceholder(scene, x, y, color, name, dialogKey, levelKey);
    }

    // === ЗАВАНТАЖУВАЛЬНА СЦЕНА ===
    class BootScene extends Phaser.Scene {
        constructor() { super({ key: 'BootScene' }); }

        preload() {
            const bar = document.getElementById('progress-fill');
            const txt = document.getElementById('loading-text');
            this.load.on('progress', p => {
                bar.style.width = Math.round(p * 100) + '%';
                txt.textContent = Math.round(p * 100) + '%';
            });
            this.load.on('complete', () => {
                document.getElementById('loading-screen').style.display = 'none';
            });
            this.load.on('loaderror', file => console.warn('Не вдалося завантажити:', file.key));
            ASSETS.forEach(a => this.load.image(a.key, a.path));
        }

        create() {
            this.scene.start('MenuScene');
        }
    }

            // Мальований фон + затемнення для читабельності
            this.add.image(512, 384, 'bg_school_yard').setDepth(0);
            this.add.rectangle(512, 384, 1024, 768, 0x0a0e1a, 0.62).setDepth(1);

            // Заголовок
            this.add.text(512, 52, '16 ДНІВ: ГОЛОС, ЯКИЙ ЧУТИ', {
                fontSize: '36px', color: '#ff6b35', fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(2);

            this.add.text(512, 88, 'Інтерактивна гра проти насильства', {
                fontSize: '18px', color: '#4ecdc4', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(2);

            // Статистика
            this.add.text(512, 116,
                `Пройдено рівнів: ${gameState.completedLevels.length}/8 | Емпатія: ${gameState.empathy}%`, {
                fontSize: '16px', color: '#ffffff', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(2);

            // Сітка рівнів (4x2)
            const startX = 180, startY = 228;
            const gapX = 220, gapY = 235;

            LEVELS.forEach((level, i) => {
                const col = i % 4;
                const row = Math.floor(i / 4);
                const x = startX + col * gapX;
                const y = startY + row * gapY;

                const isCompleted = gameState.completedLevels.includes(i);
                const isLocked = i > 0 && !gameState.completedLevels.includes(i - 1);

                // Картка рівня
                const card = this.add.rectangle(x, y, 180, 200, isLocked ? 0x1a1f2e : level.color, isLocked ? 0.9 : 0.82);
                card.setStrokeStyle(2, isCompleted ? 0x4ade80 : isLocked ? 0x666666 : 0xff6b35);
                card.setDepth(2);

                // Іконка
                this.add.text(x, y - 50, level.icon, {
                    fontSize: '48px'
                }).setOrigin(0.5).setDepth(3);

                // Назва
                this.add.text(x, y, level.title, {
                    fontSize: '16px', color: '#ffffff', fontFamily: 'Arial', align: 'center'
                }).setOrigin(0.5).setDepth(3);

                // Тема
                this.add.text(x, y + 25, level.theme, {
                    fontSize: '13px', color: '#ff6b35', fontFamily: 'Arial', align: 'center'
                }).setOrigin(0.5).setDepth(3);

                // Статус
                if (isCompleted) {
                    this.add.text(x, y + 55, '✅ Пройдено', {
                        fontSize: '14px', color: '#4ade80', fontFamily: 'Arial'
                    }).setOrigin(0.5).setDepth(3);
                } else if (isLocked) {
                    this.add.text(x, y + 55, '🔒 Заблоковано', {
                        fontSize: '14px', color: '#888888', fontFamily: 'Arial'
                    }).setOrigin(0.5).setDepth(3);
                } else {
                    this.add.text(x, y + 55, '▶ Грати', {
                        fontSize: '14px', color: '#ff6b35', fontFamily: 'Arial'
                    }).setOrigin(0.5).setDepth(3);
                }

                // Клік
                if (!isLocked) {
                    card.setInteractive({ useHandCursor: true });
                    card.on('pointerover', () => card.setFillStyle(0x2a3050, 0.95));
                    card.on('pointerout', () => card.setFillStyle(isLocked ? 0x1a1f2e : level.color, 0.82));
                    card.on('pointerdown', () => {
                        gameState.currentLevel = i;
                        gameState.factsCollected = 0;
                        // Скидаємо зібрані факти для цього рівня
                        const levelKey = `level${i + 1}`;
                        Object.values(ALL_DIALOGS[levelKey]).forEach(arr => {
                            arr.forEach(d => d.collected = false);
                        });
                        saveProgress();
                        this.scene.start(level.key);
                    });
                }
            });

            // Герої обабіч екрана
            this.add.image(72, 768, 'char_player').setOrigin(0.5, 1).setScale(0.52).setDepth(2);
            this.add.image(952, 768, 'char_anya_happy').setOrigin(0.5, 1).setScale(0.52).setDepth(2);

            // Кнопка скидання прогресу
            const resetBtn = this.add.text(512, 720, '[ Скинути прогрес ]', {
                fontSize: '16px', color: '#aaaaaa', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(3);
            resetBtn.setInteractive({ useHandCursor: true });
            resetBtn.on('pointerdown', () => {
                if (confirm('Скинути весь прогрес?')) {
                    localStorage.removeItem('16days_progress');
                    location.reload();
                }
            });
        }
    }

    // === БАЗОВИЙ КЛАС РІВНЯ ===
    class BaseLevelScene extends Phaser.Scene {
        constructor(key) { super({ key }); }

        createLevel(levelIndex, characters, opts = {}) {
            const level = LEVELS[levelIndex];
            gameState.currentLevel = levelIndex;
            const groundY = opts.groundY || null;

            // Мальований фон рівня
            this.add.image(512, 384, 'bg_' + level.bg).setDepth(0);

            // Декорації-об'єкти
            (level.decor || []).forEach(d => {
                const img = this.add.image(d.x, d.y, 'obj_' + d.o).setOrigin(0.5, 1);
                if (d.s) img.setScale(d.s);
                img.setDepth(d.y - 3);
                if (d.float) {
                    this.tweens.add({ targets: img, y: d.y - 14, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
                }
            });

            // Затемнені смуги під UI для читабельності тексту
            this.add.rectangle(512, 40, 1024, 80, 0x0a0e1a, 0.55).setDepth(900);
            this.add.rectangle(512, 748, 1024, 40, 0x0a0e1a, 0.55).setDepth(900);

            // Заголовок
            this.add.text(30, 30, `${level.icon} Рівень ${levelIndex + 1}: ${level.title}`, {
                fontSize: '22px', color: '#ff6b35', fontStyle: 'bold', fontFamily: 'Arial'
            }).setDepth(901);

            // Кнопка "Меню"
            const menuBtn = this.add.text(994, 30, '🏠 Меню', {
                fontSize: '18px', color: '#4ecdc4', fontFamily: 'Arial'
            }).setOrigin(1, 0).setDepth(901);
            menuBtn.setInteractive({ useHandCursor: true });
            menuBtn.on('pointerdown', () => this.scene.start('MenuScene'));

            // UI
            this.factsText = this.add.text(690, 30, `📋 Факти: 0/${level.facts}`, {
                fontSize: '18px', color: '#ffffff', fontFamily: 'Arial'
            }).setOrigin(1, 0).setDepth(901);

            this.empathyText = this.add.text(860, 30, `💚 Емпатія: ${gameState.empathy}%`, {
                fontSize: '18px', color: '#4ade80', fontFamily: 'Arial'
            }).setOrigin(1, 0).setDepth(901);

            // Персонажі
            characters.forEach(char => {
                createCharacter(this, char.x, char.y, char.color, char.name, char.dialogKey, `level${levelIndex + 1}`, groundY);
            });

            // Підказка
            this.add.text(30, 738, '👆 Клікай на персонажів, щоб поговорити. Збери всі факти!', {
                fontSize: '14px', color: '#cccccc', fontFamily: 'Arial'
            }).setDepth(901);

            // Вступний діалог
            this.time.delayedCall(500, () => {
                createDialogBox(this, '📖 Вступ', level.intro || 'Досліди сцену та поговори з усіма персонажами.');
            });
        }

        completeLevel() {
            if (gameState.completedLevels.includes(gameState.currentLevel)) return;

            gameState.completedLevels.push(gameState.currentLevel);
            saveProgress();

            const overlay = this.add.rectangle(512, 384, 1024, 768, 0x000000, 0.85).setDepth(1100);

            this.add.text(512, 250, '🏆 Рівень завершено!', {
                fontSize: '48px', color: '#ff6b35', fontStyle: 'bold', fontFamily: 'Arial'
            }).setOrigin(0.5).setDepth(1101);

            this.add.text(512, 350,
                `Зібрано фактів: ${gameState.factsCollected}/${LEVELS[gameState.currentLevel].facts}\nРівень емпатії: ${gameState.empathy}%`, {
                fontSize: '24px', color: '#ffffff', fontFamily: 'Arial', align: 'center'
            }).setOrigin(0.5).setDepth(1101);

            this.add.text(512, 450, LEVELS[gameState.currentLevel].lesson || '', {
                fontSize: '18px', color: '#4ecdc4', fontFamily: 'Arial', align: 'center'
            }).setOrigin(0.5).setDepth(1101);

            if (gameState.currentLevel < 7) {
                const nextBtn = this.add.text(512, 580, '[ Наступний рівень ]', {
                    fontSize: '24px', color: '#ff6b35', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0.5).setDepth(1101);
                nextBtn.setInteractive({ useHandCursor: true });
                nextBtn.on('pointerdown', () => {
                    gameState.factsCollected = 0;
                    this.scene.start(LEVELS[gameState.currentLevel + 1].key);
                });
            } else {
                const finalBtn = this.add.text(512, 580, '[ Завершити гру ]', {
                    fontSize: '24px', color: '#4ade80', fontStyle: 'bold', fontFamily: 'Arial'
                }).setOrigin(0.5).setDepth(1101);
                finalBtn.setInteractive({ useHandCursor: true });
                finalBtn.on('pointerdown', () => this.scene.start('FinalScene'));
            }

            const menuBtn = this.add.text(512, 650, '[ До меню ]', {
                fontSize: '18px', color: '#888888', fontFamily: 'Arial'
            }).setDepth(1101);
            menuBtn.setInteractive({ useHandCursor: true });
            menuBtn.on('pointerdown', () => this.scene.start('MenuScene'));
        }
    }
